# CI — chạy toàn bộ test Pest + lacdoi:validate-data trên MySQL thật.
# Đỏ ⇒ chặn merge (bật branch protection sau khi repo có remote). TEST-001 / DATA-006.
name: tests

on:
  push:
  pull_request:

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra cấu hình và các nhánh lỗi deploy (không khởi động container)
        run: python3 tools/check-deploy.py

  pest:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shake_hungry_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Cài dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Chuẩn bị môi trường
        run: |
          cp .env.example .env
          php artisan key:generate

      # Giao diện (cả trang người dùng lẫn admin) nạp tài nguyên qua @vite —
      # public/build bị gitignore nên clone sạch không có manifest, trang chủ
      # trả 500 và ExampleTest đỏ. CI phải build frontend như production.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend (Vite)
        run: |
          npm ci
          npm run build

      - name: Chuẩn bị database MySQL (collation tiếng Việt + quyền tạo trigger)
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "ALTER DATABASE shake_hungry_test CHARACTER SET utf8mb4 COLLATE utf8mb4_vi_0900_ai_ci; SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: shake_hungry_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest --no-coverage

      - name: Kiểm tra toàn vẹn dữ liệu (V1–V16)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: shake_hungry_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate:fresh --seed --force
          php artisan lacdoi:validate-data
