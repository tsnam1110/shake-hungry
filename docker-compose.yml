# Lắc Đói — Docker Compose
# Một file duy nhất cho mọi môi trường: dev, staging, production, VPS.
# Mọi cấu hình nằm trong .env.docker — xem .env.docker.example.
#
# ── MySQL trên host (Laragon / apt / Navicat cổng 3306 bình thường) ──
#   cp .env.docker.example .env.docker    # sửa giá trị theo môi trường
#   docker compose --env-file .env.docker up -d --build
#
# ── MySQL trong Docker container (máy chưa cài MySQL) ──
#   docker compose --env-file .env.docker --profile db up -d --build
#
# ── Lệnh tắt (đặt 1 lần mỗi phiên shell) ──
#   DC="docker compose --env-file .env.docker"
#   $DC up -d --build                      # MySQL host
#   $DC --profile db up -d --build         # MySQL container
#   $DC ps / $DC logs -f app / $DC down

services:
  # ── MySQL container (tuỳ chọn) ──
  # Chỉ chạy khi thêm --profile db. Không dùng khi host đã có MySQL.
  db:
    profiles: ["db"]
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_vi_0900_ai_ci
      - --log-bin-trust-function-creators=1
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-lacdoi-root}
      MYSQL_DATABASE: shake_hungry
      MYSQL_USER: ${DB_USERNAME:-lakdoi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lacdoi-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── App (PHP-FPM + Laravel) ──
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
        required: false
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Web (nginx) ──
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-1113}:80"
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  app_storage:
  app_logs:
