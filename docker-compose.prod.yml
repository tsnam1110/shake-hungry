# Lắc Đói — lớp production chồng lên docker-compose.yml (DOCKER-001)
# Chạy:  docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (--env-file BẮT BUỘC: thiếu nó, Compose nội suy mật khẩu DB từ .env/shell thay vì
#  .env.production → MySQL khởi tạo sai mật khẩu, app không kết nối được — GOLIVE-DOCKER §4.3.)
# Yêu cầu: file .env.production (từ .env.production.example) — KHÔNG commit file này.
# Khác biệt so với bản dev: không mở cổng MySQL, APP_ENV=production qua env_file,
# restart tự động, giới hạn log, cổng web 80.

services:
  db:
    ports: !override []          # production: MySQL KHÔNG lộ ra ngoài
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    env_file: !override
      - .env.production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    ports: !override
      - "80:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
