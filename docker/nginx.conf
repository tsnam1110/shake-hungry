# nginx cho Lắc Đói (DOCKER-001): phục vụ file tĩnh trong public/,
# mọi request còn lại đi qua Laravel (public/index.php → php-fpm app:9000).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Asset Vite đã băm tên file — cache dài hạn an toàn.
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Chặn file ẩn (.env, .git…) và file nhạy cảm.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.(log|sql|md)$ {
        deny all;
    }
}
