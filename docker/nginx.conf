# nginx cho Lắc Đói (DOCKER-001): phục vụ file tĩnh trong public/,
# mọi request còn lại đi qua Laravel (public/index.php → php-fpm app:9000).
#
# PROXY-001 (2026-11-03): khi stack này đứng sau một proxy HTTPS ngoài (Caddy/nginx
# host, §6.2/§6.3 của GOLIVE-DOCKER), proxy ngoài gửi X-Forwarded-Proto/For. Hai map
# dưới đây giữ nguyên giá trị đó nếu có, nếu không thì dùng scheme/IP của chính
# kết nối tới web — để Laravel (đã trustProxies trong bootstrap/app.php) sinh URL
# asset đúng scheme thật, tránh mixed content làm vỡ giao diện như sự cố 2026-11-03.
map $http_x_forwarded_proto $ld_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_for $ld_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Asset Vite đã băm tên file — cache dài hạn an toàn.
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # PROXY-001: chuyển tiếp rõ ràng header forward cho PHP-FPM (ghi đè
        # giá trị tự động nếu có, để không mất header của proxy ngoài).
        fastcgi_param HTTP_X_FORWARDED_PROTO $ld_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $ld_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
    }

    # Chặn file ẩn (.env, .git…) và file nhạy cảm.
    location ~ /\.(?!well-known).* {
        deny all;
    }
    location ~* \.(log|sql|md)$ {
        deny all;
    }
}
