# Production độc lập: không sử dụng MySQL/cổng 3306 của dự án khác.
name: shake-hungry
services:
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_vi_0900_ai_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Missing DB_ROOT_PASSWORD}
      MYSQL_DATABASE: shake_hungry
      MYSQL_USER: lakdoi
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
    volumes:
      - production_db_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u lakdoi shake_hungry -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    build:
      context: .
      target: app
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ADMIN_QUICK_LOGIN: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: shake_hungry
      DB_USERNAME: lakdoi
      DB_COLLATION: utf8mb4_vi_0900_ai_ci
      SESSION_SECURE_COOKIE: "true"
      # Root chỉ phục vụ quản trị MySQL, không truyền mật khẩu root sang PHP.
      DB_ROOT_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      # Admin của ba module ghi JSON trực tiếp; giữ file ở repo (QT-3).
      - type: bind
        source: ./data
        target: /var/www/html/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'php -r ''exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);''']
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 60s
    restart: unless-stopped
    logging: *logging
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:1113:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/up']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging
volumes:
  production_db_data:
  app_storage:
  app_logs:
